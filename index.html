<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light dark">
<title>Мой день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===================== ТЕМА: розово-лавандовое стекло ===================== */
:root{
  --bg1:#F8E7EC; --bg2:#ECDDF4; --bg3:#FCEBE1;
  --glass:rgba(255,255,255,.50); --glass2:rgba(255,255,255,.70); --glass-line:rgba(255,255,255,.80); --tile:rgba(255,255,255,.62);
  --ink:#3A2734; --ink2:#6A5361; --muted:#9C8693; --line:rgba(150,110,135,.16);
  --rose:#E596A7; --rose-deep:#B95B72; --rose-soft:#FCE4EA; --rose-rgb:229,150,167;
  --peach:#F4B39F; --lav:#B8A2E6; --lav-deep:#7E64B8; --lav-soft:#EFE7FB; --lav-rgb:184,162,230;
  --gold:#EDBF78; --gold-soft:#FBEBD2; --mint:#7DC59A; --mint-soft:#E2F4E8;
  --grad:linear-gradient(135deg,#F6BBA6 0%,#EC9DB0 55%,#D99BCB 100%);
  --on-accent:#FFFFFF;
  --shadow:0 1px 1px rgba(120,70,100,.04),0 14px 34px -18px rgba(120,70,100,.30);
  --shadow-lg:0 -12px 44px -12px rgba(110,60,90,.30);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  --spring:cubic-bezier(.3,1.5,.5,1);
}
[data-theme="dark"]{
  --bg1:#221824; --bg2:#2C2036; --bg3:#36222E;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --glass-line:rgba(255,255,255,.12); --tile:rgba(255,255,255,.06);
  --ink:#F7EAF1; --ink2:#DCC6D3; --muted:#A991A0; --line:rgba(255,255,255,.09);
  --rose:#EFA0B2; --rose-deep:#F7BCC9; --rose-soft:rgba(239,160,178,.16); --rose-rgb:239,160,178;
  --peach:#F2B5A2; --lav:#C6B2F2; --lav-deep:#D2C2F7; --lav-soft:rgba(198,178,242,.15); --lav-rgb:198,178,242;
  --gold:#F0C98A; --gold-soft:rgba(240,201,138,.15); --mint:#8FD3AA; --mint-soft:rgba(143,211,170,.15);
  --on-accent:#2A1622;
  --shadow:0 1px 1px rgba(0,0,0,.2),0 16px 36px -18px rgba(0,0,0,.7);
  --shadow-lg:0 -12px 44px -10px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%) fixed}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* Боке-фон */
.bokeh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bokeh b{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;animation:drift 16s ease-in-out infinite}
.bokeh b:nth-child(1){width:260px;height:260px;left:-80px;top:-40px;background:#F6B9C6}
.bokeh b:nth-child(2){width:220px;height:220px;right:-70px;top:180px;background:#CDB8F2;animation-delay:-5s}
.bokeh b:nth-child(3){width:240px;height:240px;left:-40px;bottom:120px;background:#F9CDB8;animation-delay:-9s}
.bokeh b:nth-child(4){width:180px;height:180px;right:10%;bottom:-40px;background:#E8B5E0;animation-delay:-2s}
[data-theme="dark"] .bokeh b{opacity:.22}
.bokeh i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.8);opacity:0;animation:twinkle 4.5s ease-in-out infinite}
[data-theme="dark"] .bokeh i{box-shadow:0 0 8px 2px rgba(255,220,235,.5)}
@keyframes drift{50%{transform:translate(26px,-30px) scale(1.12)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}

.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:12px 16px calc(124px + env(safe-area-inset-bottom))}

/* Стекло */
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}

/* ===================== Вкладки ===================== */
.tabs-row{display:flex;justify-content:center;margin:2px 0 14px}
.tabs{position:relative;display:inline-flex;border-radius:999px;padding:4px}
.tab{position:relative;z-index:1;padding:9px 22px;font-size:14px;font-weight:600;color:var(--muted);border-radius:999px;transition:color .3s}
.tab.on{color:var(--ink)}
.tabs > i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--glass2);border-radius:999px;box-shadow:0 6px 16px -8px rgba(120,70,100,.35);transition:transform .45s var(--ease)}
[data-theme="dark"] .tabs > i{background:rgba(255,255,255,.16)}
.tabs[data-on="history"] > i{transform:translateX(100%)}

.view{display:none}
.view.on{display:block}
.view.on > *{animation:rise .6s var(--ease) both}
.view.on > *:nth-child(2){animation-delay:.06s}
.view.on > *:nth-child(3){animation-delay:.12s}
.view.on > *:nth-child(4){animation-delay:.18s}
.view.on > *:nth-child(5){animation-delay:.24s}
.view.on > *:nth-child(6){animation-delay:.30s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===================== Фото-шапка ===================== */
.hero{position:relative;height:300px;border-radius:30px;overflow:hidden;margin-bottom:14px;box-shadow:0 22px 44px -22px rgba(110,50,80,.55);border:1px solid var(--glass-line)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 22%;transform:scale(1.06);animation:heroIn 1.6s var(--ease) forwards}
@keyframes heroIn{to{transform:scale(1)}}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(58,28,48,.80) 0%,rgba(58,28,48,.35) 38%,rgba(58,28,48,0) 62%),linear-gradient(to bottom,rgba(58,28,48,.25),rgba(58,28,48,0) 28%)}
.hero-top{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pill.stale{background:rgba(237,191,120,.35)}
.pill[hidden]{display:none}
.hero-text{position:absolute;left:20px;right:20px;bottom:18px;color:#fff}
.greet{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:0;text-shadow:0 2px 14px rgba(40,10,30,.35)}
.greet .name{display:inline-flex;align-items:center;gap:6px}
.spk{width:22px;height:22px;fill:#FFE3A8;filter:drop-shadow(0 0 6px rgba(255,220,160,.9));animation:spk 2.6s ease-in-out infinite}
@keyframes spk{50%{transform:scale(.75) rotate(20deg);opacity:.7}}
.hero-sub{margin:6px 0 0;font-size:14px;color:rgba(255,255,255,.85)}

/* Фокус */
.focus{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:24px;margin-bottom:14px}
.focus-ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--grad);box-shadow:0 8px 18px -8px rgba(var(--rose-rgb),.9)}
.focus-ic svg{width:20px;height:20px;fill:#fff}
.focus-label{display:block;font-size:12px;font-weight:700;color:var(--rose-deep);margin-bottom:3px}
.focus p{margin:0;font-size:15px;line-height:1.45}

/* ===================== Карточки ===================== */
.card{border-radius:28px;padding:20px 16px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px}
h2{font-weight:700;font-size:20px;margin:0;letter-spacing:-.015em}
.sub-label{font-size:13px;font-weight:700;color:var(--ink2);margin:18px 2px 10px}

.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(var(--rose-rgb),.9);transition:transform .3s var(--spring)}
.icon-btn:active{transform:scale(.86) rotate(90deg)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}

/* Прогресс */
.progress{display:flex;align-items:center;gap:12px;margin:0 2px 4px}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);transition:width .8s var(--ease);box-shadow:0 0 12px rgba(var(--rose-rgb),.6)}
.pcount{font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:50px;text-align:right}

/* Уровни и задачи */
.level{margin-top:16px}
.level-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.level-dot{width:8px;height:8px;border-radius:50%;background:var(--lav)}
.lv-min .level-dot{background:var(--rose)}
.lv-max .level-dot{background:var(--peach)}
.level-name{font-size:14px;font-weight:700}
.level-hint{font-size:12.5px;color:var(--muted)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:20px;background:var(--tile);border:1px solid var(--glass-line);
  transition:opacity .3s,background .3s,transform .25s var(--spring)}
.task:active{transform:scale(.985)}
.task.enter{animation:enter .55s var(--ease)}
.task.leave{animation:leave .35s var(--ease) forwards}
@keyframes enter{from{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes leave{to{opacity:0;transform:translateX(40px)}}
.t-ic{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--lav-soft)}
.lv-min .t-ic{background:var(--rose-soft)}
.lv-max .t-ic{background:var(--gold-soft)}
.t-ic svg{width:21px;height:21px;fill:none;stroke:var(--lav-deep);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lv-min .t-ic svg{stroke:var(--rose-deep)}
.lv-max .t-ic svg{stroke:#C08A3E}
[data-theme="dark"] .lv-max .t-ic svg{stroke:var(--gold)}
.t-body{flex:1;min-width:0;cursor:pointer}
.t-title{display:inline;font-size:15px;font-weight:600;line-height:1.35;
  background:linear-gradient(currentColor,currentColor) 0 58%/0% 1.5px no-repeat;transition:background-size .4s var(--ease),color .3s}
.task.done .t-title{background-size:100% 1.5px;color:var(--muted)}
.t-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.tag.moved{color:#B7853B;font-weight:600}
[data-theme="dark"] .tag.moved{color:var(--gold)}
.tag.own{color:var(--rose-deep);font-weight:600}
.task.moved{opacity:.7}
.task.moved .t-title{color:var(--muted)}
.check{position:relative;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.8px var(--line);background:rgba(255,255,255,.35);
  transition:background .3s,box-shadow .3s,transform .25s var(--spring)}
[data-theme="dark"] .check{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1.8px rgba(255,255,255,.18)}
.check:active{transform:scale(.8)}
.check svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.check path{stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .38s .06s var(--ease)}
.task.done .check{background:var(--mint);box-shadow:inset 0 0 0 1.8px var(--mint),0 6px 14px -6px rgba(125,197,154,.9);animation:pop .4s var(--spring)}
.task.done .check path{stroke-dashoffset:0}
.task.moved .check{box-shadow:inset 0 0 0 1.8px var(--gold);background:var(--gold-soft)}
.task.moved .check::after{content:"→";position:absolute;font-size:14px;font-weight:800;color:#C08A3E}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.plan-hint{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0}

.min-done{display:flex;align-items:center;gap:8px;max-height:0;opacity:0;overflow:hidden;font-size:13.5px;font-weight:600;color:var(--ink2);
  padding:0 14px;border-radius:16px;background:linear-gradient(135deg,var(--gold-soft),var(--rose-soft));transition:max-height .5s var(--ease),opacity .4s,margin .4s,padding .4s}
.lv-min.complete .min-done{max-height:60px;opacity:1;margin-top:10px;padding:11px 14px}
.min-done svg{flex:none;width:18px;height:18px;fill:var(--gold)}

/* Заглушки */
.stub{text-align:center;padding:16px 8px 6px}
.stub-ic{width:62px;height:62px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;background:var(--lav-soft)}
.stub-ic svg{width:28px;height:28px;stroke:var(--lav-deep);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stub h3{font-weight:700;font-size:18px;margin:0 0 6px}
.stub p{margin:0 auto 14px;max-width:300px;font-size:14px;line-height:1.5;color:var(--muted)}
.skel{height:58px;border-radius:20px;margin:10px 0;background:linear-gradient(90deg,var(--tile) 25%,var(--glass2) 50%,var(--tile) 75%);background-size:300% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

/* Состояние */
.scale{padding:14px 14px 8px;border-radius:20px;background:var(--tile);border:1px solid var(--glass-line)}
.scale + .scale{margin-top:10px}
.scale-head{display:flex;justify-content:space-between;align-items:center}
.scale-label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.scale-label svg{width:18px;height:18px;fill:none;stroke:var(--rose-deep);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.scale[data-key="energy"] .scale-label svg{stroke:#C08A3E}
[data-theme="dark"] .scale[data-key="energy"] .scale-label svg{stroke:var(--gold)}
.scale-val{font-size:13.5px;color:var(--muted);font-weight:600;padding:3px 10px;border-radius:99px;transition:all .3s}
.scale-val.set{color:var(--rose-deep);background:var(--rose-soft)}
.scale[data-key="energy"] .scale-val.set{color:#A97730;background:var(--gold-soft)}
[data-theme="dark"] .scale[data-key="energy"] .scale-val.set{color:var(--gold)}
.scale-val.swap{animation:swap .35s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(5px)}}
.dots{display:flex;justify-content:space-between;margin:2px -4px 0}
.dot{flex:1;height:52px;display:grid;place-items:center}
.dot i{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .35s var(--spring)}
[data-theme="dark"] .dot i{background:rgba(255,255,255,.05)}
.dot i::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--grad);opacity:0;transition:opacity .3s}
.scale[data-key="energy"] .dot i::before{background:linear-gradient(135deg,#F8D58E,#F2AE7E)}
.dot.fill i::before{opacity:calc(.22 + var(--k) * .156)}
.dot.sel i{transform:scale(1.18);box-shadow:0 8px 18px -6px rgba(var(--rose-rgb),.8)}
.scale[data-key="energy"] .dot.sel i{box-shadow:0 8px 18px -6px rgba(237,191,120,.9)}
.dot.sel i::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--rose);animation:ring .7s ease-out forwards}
.scale[data-key="energy"] .dot.sel i::after{border-color:var(--gold)}
.dot:active i{transform:scale(.88)}
@keyframes ring{0%{opacity:.8;transform:scale(.7)}100%{opacity:0;transform:scale(1.35)}}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-4px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:999px;background:var(--tile);border:1px solid var(--glass-line);color:var(--ink2);font-size:14px;font-weight:500;
  transition:background .25s,color .25s,box-shadow .25s,transform .25s var(--spring)}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(var(--rose-rgb),.9);animation:pop .35s var(--spring)}
.chip.static{padding:6px 12px;font-size:13px}

/* Дневник */
.q-box{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--lav-soft);margin-bottom:12px}
.q-box svg{flex:none;width:20px;height:20px;fill:var(--lav-deep);margin-top:1px}
.q-label{display:block;font-size:12px;font-weight:700;color:var(--lav-deep);margin-bottom:2px}
.question{margin:0;font-size:15.5px;line-height:1.4;font-weight:600}
textarea{width:100%;min-height:118px;resize:none;border:1px solid var(--glass-line);outline:0;border-radius:20px;padding:14px 15px;background:var(--tile);font-size:15.5px;line-height:1.5;transition:box-shadow .25s,border-color .25s}
textarea:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(var(--rose-rgb),.18)}
textarea::placeholder{color:var(--muted)}
.diary-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;min-height:16px;padding:0 4px}
.saved{opacity:0;transition:opacity .4s;color:var(--mint);font-weight:700}
.saved.on{opacity:1}

/* Закрытый день */
.closed-banner{display:none;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;border-radius:22px}
.is-closed .closed-banner{display:flex}
.closed-banner .cb-ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--gold-soft)}
.closed-banner .cb-ic svg{width:20px;height:20px;fill:var(--gold)}
.closed-banner div{flex:1;font-size:13.5px;line-height:1.35;color:var(--ink2)}
.closed-banner b{display:block;font-size:15px;color:var(--ink)}
.is-closed .lockable{pointer-events:none;opacity:.7;filter:saturate(.75);transition:opacity .4s}

/* ===================== Кнопки ===================== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:26px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg3) 45%,rgba(0,0,0,0));transition:transform .45s var(--ease),opacity .3s}
[data-theme="dark"] .dock{background:linear-gradient(to top,var(--bg3) 45%,rgba(0,0,0,0))}
.dock.hide{transform:translateY(120%);opacity:0;pointer-events:none}
.dock-inner{max-width:488px;margin:0 auto}
.dock-hint-wrap{text-align:center;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s,opacity .4s}
.dock.evening .dock-hint-wrap{max-height:46px;opacity:1}
.dock-hint{display:inline-block;font-size:12.5px;font-weight:700;color:var(--rose-deep);margin-bottom:8px;padding:6px 13px;border-radius:999px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:20px;font-size:16px;font-weight:700;
  transition:transform .22s var(--spring),box-shadow .3s}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 14px 28px -12px rgba(var(--rose-rgb),.95),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--glass-line)}
.btn.small{height:42px;width:auto;padding:0 16px;font-size:14px;display:inline-flex;border-radius:14px}
.btn.primary::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
.dock.evening .btn.primary{animation:breathe 2.8s ease-in-out infinite}
.dock.evening .btn.primary::before{animation:shine 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 14px 28px -12px rgba(var(--rose-rgb),.95),0 0 0 0 rgba(var(--rose-rgb),.4)}
  50%{box-shadow:0 14px 28px -12px rgba(var(--rose-rgb),.95),0 0 0 10px rgba(var(--rose-rgb),0);transform:scale(1.012)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* ===================== Нижняя шторка ===================== */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(60,30,50,.30);opacity:0;pointer-events:none;transition:opacity .35s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;max-height:88vh;overflow:auto;
  background:linear-gradient(170deg,var(--bg1),var(--bg2));border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);
  border-top:1px solid var(--glass-line);transform:translateY(105%);visibility:hidden;transition:transform .48s var(--ease),visibility 0s .48s}
.sheet.on{transform:none;visibility:visible;transition:transform .48s var(--ease),visibility 0s}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 16px}
.sheet-title{font-weight:700;font-size:22px;margin:0 0 4px;line-height:1.25;letter-spacing:-.015em}
.sheet-sub{margin:0 0 18px;font-size:14px;color:var(--muted)}
.field{width:100%;height:54px;border:1px solid var(--glass-line);outline:0;border-radius:18px;padding:0 16px;background:var(--tile);font-size:16px;transition:box-shadow .25s,border-color .25s}
.field:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(var(--rose-rgb),.18)}
.field.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.seg{display:flex;gap:8px;margin:14px 0 18px}
.seg button{flex:1;height:46px;border-radius:16px;background:var(--tile);border:1px solid var(--glass-line);font-size:14px;font-weight:600;color:var(--ink2);transition:all .25s var(--ease)}
.seg button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(var(--rose-rgb),.9)}
.actions{display:flex;flex-direction:column;gap:8px}
.action{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:18px;background:var(--tile);border:1px solid var(--glass-line);font-size:15.5px;font-weight:600;text-align:left;transition:transform .2s var(--spring)}
.action:active{transform:scale(.98)}
.action svg{width:20px;height:20px;fill:none;stroke:var(--rose-deep);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.action.danger{color:#C0485F}
.action.danger svg{stroke:#C0485F}
.btn-row{display:flex;flex-direction:column;gap:10px;margin-top:20px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.stat{background:var(--tile);border:1px solid var(--glass-line);border-radius:18px;padding:12px 4px;text-align:center}
.stat b{display:block;font-weight:700;font-size:23px;line-height:1.1;letter-spacing:-.02em}
.stat b small{font-size:13px;color:var(--muted);font-weight:600}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.stat.ok b{color:var(--mint)}
.sum-list{margin:0;padding:0;list-style:none}
.sum-list li{font-size:14.5px;padding:5px 2px;color:var(--ink2);display:flex;gap:9px}
.sum-list li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--lav);margin-top:7px}
.sum-list.moved li::before{background:var(--gold)}
.quote{margin:0;padding:13px 15px;border-radius:18px;background:var(--lav-soft);font-style:italic;font-size:15px;line-height:1.5;color:var(--ink2)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:14px 2px 0}

/* ===================== Финальный экран ===================== */
.final{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;overflow:hidden;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));opacity:0;pointer-events:none;transition:opacity .5s}
.final.on{opacity:1;pointer-events:auto}
.final-inner{position:relative;text-align:center;max-width:340px}
.final-photo{position:relative;width:132px;height:132px;margin:0 auto 18px}
.final-photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:52% 18%;border:3px solid rgba(255,255,255,.9);box-shadow:0 18px 36px -14px rgba(110,50,80,.6)}
.final-photo svg{position:absolute;inset:-12px;width:156px;height:156px}
.final-photo circle{fill:none;stroke:url(#ringGrad);stroke-width:3;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;transform:rotate(-90deg);transform-origin:center}
.final.on .final-photo circle{animation:draw 1.2s .15s var(--ease) forwards}
.final-badge{position:absolute;right:-2px;bottom:4px;width:40px;height:40px;border-radius:50%;background:var(--mint);display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(125,197,154,.9);transform:scale(0)}
.final.on .final-badge{animation:pop .5s 1.1s var(--spring) forwards}
.final-badge svg{position:static;width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes draw{to{stroke-dashoffset:0}}
.final h2{font-size:30px;margin-bottom:10px;letter-spacing:-.02em}
.final-phrase{font-size:17px;line-height:1.45;color:var(--ink2);margin:0 0 10px}
.final-stats{font-size:14px;color:var(--muted);margin:0 0 24px}
.final .fade{opacity:0}
.final.on .fade{animation:rise .6s var(--ease) forwards}
.final.on .fade.d1{animation-delay:1.1s}
.final.on .fade.d2{animation-delay:1.3s}
.final.on .fade.d3{animation-delay:1.5s}
.final-btns{display:flex;flex-direction:column;gap:10px}
.final-note{font-size:12.5px;color:var(--muted);margin-top:12px}

/* ===================== Итоги ===================== */
.h-hero{display:flex;align-items:center;gap:14px;padding:4px 4px 16px}
.avatar{flex:none;width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:52% 16%;border:2.5px solid rgba(255,255,255,.9);box-shadow:0 10px 22px -10px rgba(110,50,80,.6)}
.h-hero h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.h-hero p{margin:2px 0 0;color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--tile);border:1px solid var(--glass-line);border-radius:20px;padding:14px}
.kpi-top{display:flex;align-items:center;gap:8px}
.kpi-top i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--rose-soft)}
.kpi-top i svg{width:16px;height:16px;fill:none;stroke:var(--rose-deep);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi.min .kpi-top i{background:var(--mint-soft)} .kpi.min .kpi-top i svg{stroke:#4FA373}
.kpi.mood .kpi-top i{background:var(--lav-soft)} .kpi.mood .kpi-top i svg{stroke:var(--lav-deep)}
.kpi.energy .kpi-top i{background:var(--gold-soft)} .kpi.energy .kpi-top i svg{stroke:#C08A3E}
.kpi-top span{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi b{display:block;font-weight:700;font-size:27px;margin-top:8px;line-height:1.1;letter-spacing:-.02em}
.kpi b small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .kbar{display:block;height:5px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}
.kpi .kbar em{display:block;height:100%;width:0;border-radius:9px;background:var(--grad);transition:width 1s .2s var(--ease)}
.kpi.min .kbar em{background:var(--mint)}
.kpi.mood .kbar em{background:var(--lav)}
.kpi.energy .kbar em{background:linear-gradient(90deg,#F8D58E,#F2AE7E)}
.insight{display:flex;gap:10px;margin-top:12px;padding:13px 14px;border-radius:18px;background:linear-gradient(135deg,var(--lav-soft),var(--rose-soft));font-size:14px;line-height:1.45}
.insight svg{flex:none;width:20px;height:20px;fill:var(--lav-deep)}

.bars{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;align-items:end;height:150px;margin-top:4px}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bval{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.bar{position:relative;width:100%;max-width:34px;height:0;border-radius:12px;background:linear-gradient(to top,rgba(var(--lav-rgb),.55),var(--rose));transition:height .9s var(--ease);box-shadow:0 8px 16px -10px rgba(var(--rose-rgb),.9)}
.bar.low{background:linear-gradient(to top,rgba(var(--lav-rgb),.25),rgba(var(--lav-rgb),.55));box-shadow:none}
.bar.min::after{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2.5px var(--glass2),0 0 10px rgba(237,191,120,.9)}
.blabels,.strip{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;margin-top:8px;align-items:center}
.blabel{text-align:center;font-size:11px;color:var(--muted);font-weight:600;line-height:1.25}
.blabel b{display:block;font-size:13px;color:var(--ink2)}
.blabel.today b{color:var(--rose-deep)}
.strips{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.strip-name{font-size:11.5px;color:var(--muted);font-weight:700}
.cell{display:grid;place-items:center}
.cell i{width:20px;height:20px;border-radius:50%;background:var(--rose);opacity:.1;transition:opacity .6s,transform .5s var(--spring);transform:scale(.6)}
.chart.grow .cell i{transform:scale(1)}
.strip.energy .cell i{background:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

.tbl{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:60px 1fr 28px 48px 48px;gap:8px;align-items:center;padding:11px 10px;border-radius:16px;background:var(--tile);border:1px solid var(--glass-line);transition:transform .2s var(--spring)}
.trow.head{background:none;border-color:transparent;padding-top:0;padding-bottom:2px;font-size:11px;font-weight:700;color:var(--muted)}
.trow:not(.head):active{transform:scale(.98)}
.trow.flash{animation:flash 1.8s var(--ease)}
@keyframes flash{0%,40%{background:var(--rose-soft);box-shadow:0 0 0 2px var(--rose)}100%{}}
.td-date{font-size:13.5px;font-weight:700;line-height:1.2}
.td-date small{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.td-prog{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.td-prog i{display:block;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.td-prog i em{display:block;height:100%;border-radius:9px;background:var(--grad)}
.td-min{display:grid;place-items:center}
.td-min b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:var(--mint)}
.td-min.no b{background:var(--line);color:var(--muted)}
.mini{display:flex;gap:3px}
.mini b{width:7px;height:7px;border-radius:50%;background:var(--line)}
.mini b.f{background:var(--rose)}
.mini.energy b.f{background:var(--gold)}

/* ===================== Дни активности ===================== */
.streaks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.streak{background:var(--tile);border:1px solid var(--glass-line);border-radius:18px;padding:12px 8px;text-align:center}
.streak b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.streak.main{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 12px 24px -12px rgba(var(--rose-rgb),.95)}
.streak.main span{color:rgba(255,255,255,.9)}
.streak span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px;line-height:1.25}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.cal-title{font-size:15px;font-weight:700}
.cal-title small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tile);border:1px solid var(--glass-line);transition:transform .25s var(--spring),opacity .2s}
.cal-nav button:active{transform:scale(.88)}
.cal-nav button[disabled]{opacity:.35;pointer-events:none}
.cal-nav svg{width:16px;height:16px;fill:none;stroke:var(--ink2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cd{position:relative;aspect-ratio:1;border-radius:13px;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink2);
  background:var(--tile);border:1px solid var(--glass-line);animation:cdIn .45s var(--spring) both;animation-delay:calc(var(--i) * 12ms)}
@keyframes cdIn{from{opacity:0;transform:scale(.6)}}
.cd.empty{background:none;border:0;animation:none}
.cd.future{opacity:.35}
.cd.act{color:#fff;border-color:transparent;cursor:pointer;box-shadow:0 6px 14px -8px rgba(var(--rose-rgb),.9);transition:transform .2s var(--spring)}
.cd.act:active{transform:scale(.9)}
.cd.min::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.cd.today{box-shadow:0 0 0 2px var(--rose)}
.cal-legend{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.cal-scale{display:inline-flex;align-items:center;gap:4px}
.cal-scale i{width:14px;height:14px;border-radius:5px;display:inline-block}

/* ===================== Тост и искры ===================== */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:rgba(58,39,52,.88);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 12px 30px -10px rgba(0,0,0,.4);transition:transform .4s var(--spring),opacity .3s}
.toast.on{transform:translate(-50%,0);opacity:1}
.spark{position:fixed;z-index:90;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:spark .9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(var(--s));opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

  const ins = s => s.replace(/а$/, 'ой');  // → Ассистессой

  /* ===================== Хранилище: облако Telegram → localStorage → память ===================== */
  const cloudOK = isTG && ver('6.9') && !!tg.CloudStorage;
  const mem = {};
  function localGet(k) { try { const v = localStorage.getItem('myday_' + k); if (v != null) return v; } catch (e) {} return mem[k] == null ? null : mem[k]; }
  function localSet(k, v) { mem[k] = v; try { localStorage.setItem('myday_' + k, v); } catch (e) {} }
  const store = {
    get(k) {
      return new Promise(res => {
        if (!cloudOK) return res(localGet(k));
        let done = false;
        const t = setTimeout(() => { if (!done) { done = true; res(localGet(k)); } }, 1500);
        try {
          tg.CloudStorage.getItem(k, (err, val) => {
            if (done) return; done = true; clearTimeout(t);
            res(err || val == null || val === '' ? localGet(k) : val);
          });
        } catch (e) { done = true; clearTimeout(t); res(localGet(k)); }
      });
    },
    set(k, v) { localSet(k, v); if (cloudOK) { try { tg.CloudStorage.setItem(k, v, () => {}); } catch (e) {} } }
  };

  /* ===================== Даты (по часовому поясу Ассистессы) ===================== */
  function zoneNow() {
    try {
      const p = new Intl.DateTimeFormat('en-CA', { timeZone: cfg.timezone, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
      const o = {}; p.forEach(x => { o[x.type] = x.value; });
      return { date: o.year + '-' + o.month + '-' + o.day, h: (+o.hour) % 24, m: +o.minute };
    } catch (e) {
      const d = new Date(), z = n => String(n).padStart(2, '0');
      return { date: d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()), h: d.getHours(), m: d.getMinutes() };
    }
  }
  const asDate = iso => new Date(iso + 'T12:00:00Z');
  const fmt = (iso, o) => { try { return new Intl.DateTimeFormat('ru-RU', Object.assign({ timeZone: 'UTC' }, o)).format(asDate(iso)); } catch (e) { return iso; } };
  const fmtLong = iso => fmt(iso, { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtDM = iso => fmt(iso, { day: 'numeric', month: 'long' });
  const fmtWd = iso => fmt(iso, { weekday: 'short' }).replace('.', '');
  const fmtDay = iso => fmt(iso, { day: 'numeric' });
  const hhmm = () => { const n = zoneNow(); return String(n.h).padStart(2, '0') + ':' + String(n.m).padStart(2, '0'); };

  /* ===================== Состояние дня ===================== */
  const blankDay = () => ({ v: 1, tasks: {}, added: [], mood: 0, energy: 0, emotions: [], diary: '', closed: false, closedAt: null });
  async function loadDay(key) {
    const raw = await store.get('day_' + key);
    try { const d = JSON.parse(raw); if (d && d.v) return Object.assign(blankDay(), d); } catch (e) {}
    return blankDay();
  }
  let saveTimer = null;
  function saveDay(now) {
    clearTimeout(saveTimer);
    const write = () => store.set('day_' + dayKey, JSON.stringify(S));
    if (now) write(); else saveTimer = setTimeout(write, 350);
  }
  async function loadHist() {
    try { const h = JSON.parse(await store.get('history')); if (Array.isArray(h)) return h; } catch (e) {}
    return [];
  }
  function saveHist() { store.set('history', JSON.stringify(localHist.slice(0, 30))); }

  /* ===================== Задачи ===================== */
  function tasksOf(level) {
    const base = (plan[level] || []).map(t => ({ id: String(t.id), title: t.title, tag: t.tag || '', level, own: false }));
    const own = S.added.filter(t => t.level === level).map(t => Object.assign({ own: true }, t));
    return base.concat(own);
  }
  const allTasks = () => LEVELS.flatMap(L => tasksOf(L.key));
  const stOf = id => S.tasks[id] || '';
  function counts() {
    const all = allTasks();
    const active = all.filter(t => stOf(t.id) !== 'moved');
    const done = active.filter(t => stOf(t.id) === 'done');
    const mins = tasksOf('min').filter(t => stOf(t.id) !== 'moved');
    const minDone = mins.length > 0 && mins.every(t => stOf(t.id) === 'done');
    return { all, active, done, minDone, moved: all.filter(t => stOf(t.id) === 'moved'), notDone: active.filter(t => stOf(t.id) !== 'done') };
  }

  /* ===================== Отрисовка: шапка ===================== */
  const SPARK = '<svg class="spk" viewBox="0 0 24 24"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>';
  function renderHeader() {
    const n = zoneNow();
    $('#dateLabel').textContent = fmtLong(n.date);
    const g = n.h < 5 ? 'Доброй ночи' : n.h < 12 ? 'Доброе утро' : n.h < 17 ? 'Добрый день' : n.h < 23 ? 'Добрый вечер' : 'Доброй ночи';
    $('#greet').innerHTML = cfg.name ? esc(g) + ',<br><span class="name">' + esc(cfg.name) + SPARK + '</span>' : esc(g) + ' ' + SPARK;
    let sub = '';
    if (planStatus === 'ok' && S) {
      const c = counts();
      const left = c.active.length - c.done.length;
      sub = S.closed ? 'День закрыт. Можно отдыхать' : left ? 'Сегодня в плане ' + c.active.length + ' ' + plural(c.active.length, 'задача', 'задачи', 'задач') + ', осталось ' + left : 'Всё из плана сделано';
    }
    $('#heroSub').textContent = sub;
    $('#focusLabel').textContent = 'Фокус дня от ' + gen(cfg.assistantName);
    $('#focus').textContent = cfg.focus || (planStatus === 'loading' ? 'Загружаю план…' : 'Фокус появится вместе с планом');
    const stale = $('#stale');
    if (planStatus === 'ok' && planDate && planDate !== n.date) { stale.hidden = false; stale.textContent = 'план от ' + fmtDM(planDate); }
    else stale.hidden = true;
    const sp = $('#streakPill'), st = streakInfo();
    if (st.cur >= 2 && stale.hidden) { sp.hidden = false; sp.innerHTML = '<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:#FFE3A8"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>' + st.cur + ' ' + plural(st.cur, 'день', 'дня', 'дней') + ' подряд'; }
    else sp.hidden = true;
    $('#question').textContent = cfg.diaryQuestion;
    $('#dockHint').textContent = cfg.assistantName + ' ждёт итог дня';
  }

  /* ===================== Отрисовка: план ===================== */
  function taskIcon(t) {
    if (t.own && !t.tag) return ICON_OWN;
    return TAG_ICONS[String(t.tag || '').toLowerCase()] || ICON_DEFAULT;
  }
  function taskHTML(t) {
    const st = stOf(t.id);
    const meta = [];
    if (t.tag) meta.push('<span class="tag">' + esc(t.tag) + '</span>');
    if (t.own) meta.push('<span class="tag own">добавлена тобой</span>');
    if (st === 'moved') meta.push('<span class="tag moved">→ на завтра</span>');
    return '<li class="task ' + st + '" data-id="' + esc(t.id) + '">' +
      '<span class="t-ic"><svg viewBox="0 0 24 24">' + taskIcon(t) + '</svg></span>' +
      '<div class="t-body" data-act="menu"><span class="t-title">' + esc(t.title) + '</span>' + (meta.length ? '<div class="t-meta">' + meta.join('<span>·</span>') + '</div>' : '') + '</div>' +
      '<button class="check" data-act="toggle" aria-label="Отметить задачу"><svg viewBox="0 0 24 24"><path d="M6.5 12.5l3.6 3.6 7.4-8"/></svg></button></li>';
  }
  function stubHTML() {
    if (planStatus === 'error') {
      return '<div class="stub"><div class="stub-ic"><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/><path d="M12 11v3M12 16.5v.01"/></svg></div>' +
        '<h3>План пока не загрузился</h3><p>Проверь связь или загляни чуть позже. А пока можно добавить задачи самой — они сохранятся.</p>' +
        '<button class="btn ghost small" id="retryBtn">Повторить</button></div>';
    }
    return '<div class="stub"><div class="stub-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>' +
      '<h3>' + esc(cfg.assistantName) + ' ещё готовит план</h3><p>Обычно он появляется к 8:30, в выходные — к 10:30. Свои задачи можно добавить уже сейчас.</p></div>';
  }
  function renderPlan() {
    const wrap = $('#levels');
    if (planStatus === 'loading') { wrap.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; return; }
    let html = (planStatus === 'error' || planStatus === 'pending') ? stubHTML() : '';
    let any = false;
    LEVELS.forEach(L => {
      const items = tasksOf(L.key);
      if (!items.length) return;
      any = true;
      html += '<div class="level lv-' + L.key + '"><div class="level-head"><span class="level-dot"></span><span class="level-name">' + L.name + '</span><span class="level-hint">' + L.hint + '</span></div>' +
        '<ul class="tasks">' + items.map(taskHTML).join('') + '</ul>' +
        (L.key === 'min' ? '<div class="min-done"><svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.4 6.9.5-5.3 4.4 1.7 6.7L12 16.3 6.1 20l1.7-6.7L2.5 8.9l6.9-.5z"/></svg>' + esc(cfg.minimumDonePhrase) + '</div>' : '') +
        '</div>';
    });
    if (any) html += '<p class="plan-hint">Нажми на задачу, чтобы перенести её на завтра</p>';
    wrap.innerHTML = html;
    const r = $('#retryBtn'); if (r) r.onclick = () => { hap('light'); loadData(); };
    refreshTasks(false);
  }
  function refreshTasks(animate, fromEl) {
    if (planStatus === 'loading') return;
    document.querySelectorAll('.task').forEach(li => {
      const st = stOf(li.dataset.id);
      li.classList.toggle('done', st === 'done');
      li.classList.toggle('moved', st === 'moved');
    });
    const c = counts();
    const total = c.active.length;
    $('#pfill').style.width = total ? Math.round(c.done.length / total * 100) + '%' : '0%';
    $('#pcount').textContent = total ? c.done.length + ' из ' + total : '—';
    const minBox = document.querySelector('.lv-min');
    if (minBox) minBox.classList.toggle('complete', c.minDone);
    if (animate && c.minDone && !prevMinDone) { burst(fromEl || minBox); hap('success'); }
    prevMinDone = c.minDone;
    renderHeader();
  }

  /* ===================== Отрисовка: состояние и дневник ===================== */
  const SC_IC = {
    mood: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14c1 1.3 2.1 2 3.5 2s2.5-.7 3.5-2M9 9.5v.5M15 9.5v.5"/></svg>',
    energy: '<svg viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg>'
  };
  function scaleHTML(key, label, words) {
    let dots = '';
    for (let i = 1; i <= 5; i++) dots += '<button class="dot" data-v="' + i + '" style="--k:' + i + '" aria-label="' + label + ': ' + words[i - 1] + '"><i></i></button>';
    return '<div class="scale" data-key="' + key + '"><div class="scale-head"><span class="scale-label">' + SC_IC[key] + label + '</span><span class="scale-val" id="' + key + 'Val">не отмечено</span></div>' +
      '<div class="dots">' + dots + '</div><div class="scale-ends"><span>' + words[0] + '</span><span>' + words[4] + '</span></div></div>';
  }
  function renderScales() {
    $('#scales').innerHTML = scaleHTML('mood', 'Настроение', MOOD) + scaleHTML('energy', 'Энергия', ENERGY);
    updateScale('mood', false); updateScale('energy', false);
  }
  function updateScale(key, animate) {
    const words = key === 'mood' ? MOOD : ENERGY, v = S[key];
    document.querySelectorAll('.scale[data-key="' + key + '"] .dot').forEach(d => {
      const n = +d.dataset.v;
      d.classList.toggle('fill', n <= v);
      d.classList.remove('sel');
      if (n === v) { if (animate) void d.offsetWidth; d.classList.add('sel'); }
    });
    const val = $('#' + key + 'Val');
    val.textContent = v ? words[v - 1] : 'не отмечено';
    val.classList.toggle('set', !!v);
    if (animate) { val.classList.remove('swap'); void val.offsetWidth; val.classList.add('swap'); }
  }
  function renderEmotions() {
    $('#emotions').innerHTML = cfg.emotions.map(e => '<button class="chip' + (S.emotions.includes(e) ? ' on' : '') + '" data-e="' + esc(e) + '">' + esc(e) + '</button>').join('');
  }
  function renderDiary() {
    const ta = $('#diary');
    ta.value = S.diary || '';
    autosize(ta);
    $('#counter').textContent = ta.value.length + ' / 1500';
  }
  function autosize(ta) { ta.style.height = 'auto'; ta.style.height = Math.max(118, ta.scrollHeight + 2) + 'px'; }

  /* ===================== Закрытый день и кнопка ===================== */
  function renderClosed() {
    $('#app').classList.toggle('is-closed', !!S.closed);
    $('#closedAt').textContent = S.closed ? 'в ' + (S.closedAt || '') + ' · итог у ' + gen(cfg.assistantName) : '';
    renderDock();
  }
  function renderDock() {
    const n = zoneNow();
    const parts = (cfg.eveningTime || '22:40').split(':');
    const mins = n.h * 60 + n.m, ev = (+parts[0]) * 60 + (+parts[1] || 0);
    const evening = mins >= ev || n.h < 4;
    const dock = $('#dock');
    dock.classList.toggle('evening', evening && !S.closed);
    dock.classList.toggle('hide', !!S.closed || activeTab !== 'today');
  }

  /* ===================== Итоги ===================== */
  function getHistory() {
    const map = {};
    (cfg.history || []).forEach(h => { if (h && h.date) map[h.date] = Object.assign({ src: 'assistant' }, h); });
    localHist.forEach(h => { if (h && h.date) map[h.date] = Object.assign({}, map[h.date], h, { src: 'app' }); });
    return Object.values(map).sort((a, b) => a.date < b.date ? 1 : -1);
  }
  const pctOf = h => h.total ? Math.round(h.done / h.total * 100) : 0;
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  const miniDots = (v, cls) => { let s = '<div class="mini ' + (cls || '') + '">'; for (let i = 1; i <= 5; i++) s += '<b class="' + (i <= v ? 'f' : '') + '"></b>'; return s + '</div>'; };
  const fmtNum = x => x.toFixed(1).replace('.', ',');
  function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? b : c; }

  function insightText(list) {
    const hi = list.filter(h => h.energy >= 4 && h.total), lo = list.filter(h => h.energy && h.energy <= 2 && h.total);
    if (hi.length && lo.length) {
      return 'В дни с энергией 4–5 ты выполняешь в среднем ' + Math.round(avg(hi.map(pctOf))) + '% плана, а в дни с энергией 1–2 — ' + Math.round(avg(lo.map(pctOf))) + '%. План стоит подстраивать под силы, а не наоборот.';
    }
    const mv = list.reduce((a, h) => a + (h.moved || 0), 0);
    if (mv >= 3) return 'За эти дни на завтра перенесено задач: ' + mv + '. Посмотри с ' + ins(cfg.assistantName) + ', какие из них переезжают снова и снова.';
    return '';
  }

  /* ---- дни активности: серия и календарь ---- */
  const shiftDay = (iso, n) => { const d = asDate(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  function streakInfo() {
    const set = new Set(getHistory().map(h => h.date));
    const today = zoneNow().date;
    let d = set.has(today) ? today : shiftDay(today, -1), cur = 0;
    while (set.has(d)) { cur++; d = shiftDay(d, -1); }
    let best = 0, run = 0, prev = null;
    Array.from(set).sort().forEach(x => { run = prev && shiftDay(prev, 1) === x ? run + 1 : 1; best = Math.max(best, run); prev = x; });
    return { cur, best, total: set.size };
  }
  let calMonth = null;
  function calendarHTML() {
    const today = zoneNow().date, nowMonth = today.slice(0, 7);
    if (!calMonth) calMonth = nowMonth;
    const y = +calMonth.slice(0, 4), m = +calMonth.slice(5, 7);
    const daysIn = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
    const map = {}; getHistory().forEach(h => { map[h.date] = h; });
    let cells = '', active = 0, i = 0;
    for (let k = 0; k < lead; k++) cells += '<span class="cd empty"></span>';
    for (let d = 1; d <= daysIn; d++) {
      const iso = calMonth + '-' + String(d).padStart(2, '0'), h = map[iso];
      let cls = 'cd', style = '--i:' + (i++), data = '';
      if (h) {
        active++;
        cls += ' act' + (h.minDone ? ' min' : '');
        style += ';background:linear-gradient(135deg,rgba(var(--rose-rgb),' + (0.32 + pctOf(h) / 100 * 0.68).toFixed(2) + '),rgba(var(--lav-rgb),' + (0.28 + pctOf(h) / 100 * 0.6).toFixed(2) + '))';
        data = ' data-date="' + iso + '"';
      } else if (iso > today) cls += ' future';
      if (iso === today) cls += ' today';
      cells += '<span class="' + cls + '" style="' + style + '"' + data + '>' + d + '</span>';
    }
    let title = fmt(calMonth + '-15', { month: 'long', year: 'numeric' }).replace(/\s*г\.?$/, '');
    title = title.charAt(0).toUpperCase() + title.slice(1);
    return '<div class="cal-head"><div class="cal-title">' + esc(title) + '<small>активных дней: ' + active + '</small></div>' +
      '<div class="cal-nav"><button data-cal="-1" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>' +
      '<button data-cal="1" aria-label="Следующий месяц"' + (calMonth >= nowMonth ? ' disabled' : '') + '><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div></div>' +
      '<div class="cal-wd"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="cal-legend"><span class="cal-scale">меньше <i style="background:rgba(var(--rose-rgb),.35)"></i><i style="background:rgba(var(--rose-rgb),.65)"></i><i style="background:rgba(var(--rose-rgb),1)"></i> больше</span>' +
      '<span class="cal-scale"><i style="background:var(--gold);border-radius:50%;width:9px;height:9px"></i> минимум закрыт</span></div>';
  }
  function activityHTML() {
    const st = streakInfo();
    return '<section class="card glass"><div class="card-head"><h2>Дни активности</h2></div>' +
      '<div class="streaks">' +
        '<div class="streak main"><b>' + st.cur + '</b><span>' + plural(st.cur, 'день', 'дня', 'дней') + ' подряд</span></div>' +
        '<div class="streak"><b>' + st.best + '</b><span>лучшая серия</span></div>' +
        '<div class="streak"><b>' + st.total + '</b><span>всего закрыто</span></div>' +
      '</div><div id="calBox">' + calendarHTML() + '</div>' +
      '<p class="note">Активный день — тот, который ты закрыла. Чем ярче клетка, тем больше плана сделано. Нажми на день, чтобы открыть его итог.</p></section>';
  }

  const KPI_IC = {
    rate: '<svg viewBox="0 0 24 24"><path d="M4 18l5-5 4 3 7-8"/></svg>',
    min: '<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4 4 9-9"/></svg>',
    mood: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14c1 1.3 2.1 2 3.5 2s2.5-.7 3.5-2"/></svg>',
    energy: '<svg viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg>'
  };
  function renderHistory(flashDate) {
    const body = $('#historyBody');
    const list = getHistory();
    if (!list.length) {
      body.innerHTML = '<section class="card glass"><div class="stub"><div class="stub-ic"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>' +
        '<h3>Здесь пока пусто</h3><p>Закрой первый день — и здесь появится строка с итогами.</p></div></section>';
      return;
    }
    const week = list.slice(0, 7);
    const today = zoneNow().date;
    const rate = Math.round(avg(week.map(pctOf)));
    const minDays = week.filter(h => h.minDone).length;
    const moodW = week.filter(h => h.mood), enW = week.filter(h => h.energy);
    const moodAvg = avg(moodW.map(h => h.mood)), enAvg = avg(enW.map(h => h.energy));
    const insight = insightText(week);
    const kpi = (cls, ic, label, val, w) => '<div class="kpi ' + cls + '"><div class="kpi-top"><i>' + ic + '</i><span>' + label + '</span></div><b>' + val + '</b><span class="kbar"><em data-w="' + w + '"></em></span></div>';

    let html = activityHTML() + '<section class="card glass"><div class="card-head"><h2>Последние ' + week.length + ' ' + plural(week.length, 'день', 'дня', 'дней') + '</h2></div>' +
      '<div class="kpis">' +
        kpi('', KPI_IC.rate, 'Выполнение', rate + '<small>%</small>', rate) +

  function openTaskMenu(id) {
    const t = allTasks().find(x => x.id === id); if (!t) return;
    const st = stOf(id), L = LEVELS.find(l => l.key === t.level);
    let acts = '';
    if (st !== 'moved') acts += '<button class="action" data-a="done">' + (st === 'done' ? IC.undo + 'Снять отметку' : IC.done + 'Отметить сделанной') + '</button>';
    acts += '<button class="action" data-a="move">' + (st === 'moved' ? IC.back + 'Вернуть в план' : IC.move + 'Перенести на завтра') + '</button>';

    openSheet('<h3 class="sheet-title">' + esc(t.title) + '</h3><p class="sheet-sub">' + L.name + (t.tag ? ' · ' + esc(t.tag) : '') + (t.own ? ' · добавлена тобой' : '') + '</p><div class="actions">' + acts + '</div>');

        if (st === 'moved') { delete S.tasks[id]; toast('Задача вернулась в план'); }

        const li = document.querySelector('.task[data-id="' + id + '"]');

    if (st === 'done') delete S.tasks[id]; else S.tasks[id] = 'done';

    refreshTasks(true, fromEl);

  function buildDayText() {
    const c = counts();
    const L = arr => arr.map(t => t.title).join('; ');
    let out = '📋 Мой день ' + dayKey + '\n';
    out += 'Сделано ' + c.done.length + ' из ' + c.active.length + (c.minDone ? ' · минимум ✓' : ' · минимум —') + '\n';
    if (S.mood || S.energy) out += 'Настроение ' + (S.mood || '—') + '/5 · энергия ' + (S.energy || '—') + '/5\n';
    if (c.done.length) out += '✅ ' + L(c.done) + '\n';
    if (c.notDone.length) out += '⬜ Не сделано: ' + L(c.notDone) + '\n';
    if (c.moved.length) out += '➡️ Перенесено: ' + L(c.moved) + '\n';
    if (S.emotions && S.emotions.length) out += 'Эмоции: ' + S.emotions.join(', ') + '\n';
    if (S.diary && S.diary.trim()) out += 'Дневник: ' + S.diary.trim() + '\n';
    return out.trim();
  }

  function copyText(text, ok) {
    const fin = () => { if (ok) ok(); };
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); fin();
      } catch (e) { try { window.prompt('Скопируй текст дня:', text); } catch (_) {} }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(fin, fallback); }
      else { fallback(); }
    } catch (e) { fallback(); }
  }

  function copyDay() {
    copyText(buildDayText(), () => toast('Скопировано — вставь в чат ' + dat(cfg.assistantName)));
    closeDay();
  }

  function closeDay() {
    const c = counts();
    S.closed = true; S.closedAt = hhmm();
    saveDay(true);
    const entry = { date: dayKey, done: c.done.length, total: c.active.length, minDone: c.minDone, moved: c.moved.length, mood: S.mood, energy: S.energy, emotions: S.emotions.slice() };
    localHist = [entry].concat(localHist.filter(h => h.date !== dayKey));
    saveHist();
    closeSheet(); renderClosed(); renderHeader(); renderHistory();
    hap('success');

    const phrases = cfg.closingPhrases && cfg.closingPhrases.length ? cfg.closingPhrases : DEFAULTS.closingPhrases;
    $('#finalPhrase').textContent = phrases[Math.floor(Math.random() * phrases.length)];
    $('#finalStats').textContent = 'Сделано ' + c.done.length + ' из ' + c.active.length + (c.minDone ? ' · минимум закрыт' : '') + (S.mood ? ' · настроение ' + S.mood + '/5' : '');
    $('#finalNote').textContent = isTG ? 'Отправляю итог ' + dat(cfg.assistantName) + '…' : 'Это превью вне Telegram: итог сохранён здесь, но боту не отправляется.';
    $('#final').classList.add('on');

    if (isTG) {
      const payload = {
        type: 'day_close', date: dayKey, closedAt: S.closedAt,
        done: c.done.map(t => t.title), notDone: c.notDone.map(t => t.title), moved: c.moved.map(t => t.title),
        added: S.added.map(t => t.title), minDone: c.minDone,
        mood: S.mood, energy: S.energy, emotions: S.emotions, diary: S.diary.trim()
      };
      let s = JSON.stringify(payload);
      const size = str => (window.TextEncoder ? new TextEncoder().encode(str).length : str.length * 2);
      while (size(s) > 4000 && payload.diary.length) { payload.diary = payload.diary.slice(0, Math.max(0, payload.diary.length - 150)) + '…'; s = JSON.stringify(payload); }
      setTimeout(() => {
        try { tg.sendData(s); } catch (e) {}
        // если Telegram не закрыл приложение (открыто не кнопкой бота) — остаёмся на экране
        setTimeout(() => { $('#finalNote').textContent = 'Итог сохранён в приложении.'; }, 1500);
      }, 2600);
    }
  }

  $('#toHistory').addEventListener('click', () => { $('#final').classList.remove('on'); setTab('history', dayKey); });
  $('#historyBody').addEventListener('click', e => {
    const nav = e.target.closest('[data-cal]');
    if (nav) {
      const y = +calMonth.slice(0, 4), m = +calMonth.slice(5, 7) - 1 + (+nav.dataset.cal);
      const d = new Date(Date.UTC(y, m, 1)); calMonth = d.toISOString().slice(0, 7);
      $('#calBox').innerHTML = calendarHTML(); hap('select'); return;
    }
    const r = e.target.closest('[data-date]'); if (r) { hap('light'); openDayDetail(r.dataset.date); }
  });

  /* ===================== Тема ===================== */
  function applyTheme() {
    let dark;
    if (isTG) dark = tg.colorScheme === 'dark';
    else dark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const top = dark ? '#221824' : '#F8E7EC', bottom = dark ? '#36222E' : '#FCEBE1';
    if (ver('6.9')) { try { tg.setHeaderColor(top); tg.setBackgroundColor(top); } catch (e) {} }
    if (ver('7.10')) { try { tg.setBottomBarColor(bottom); } catch (e) {} }
  }
  applyTheme();
  if (isTG) { try { tg.onEvent('themeChanged', applyTheme); } catch (e) {} }
  else if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {} }

  /* ===================== Загрузка данных ===================== */
  async function loadData() {
    planStatus = 'loading'; renderPlan(); renderHeader();
    try {
      const r = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      ['name', 'assistantName', 'timezone', 'eveningTime', 'focus', 'diaryQuestion', 'minimumDonePhrase'].forEach(k => { if (typeof d[k] === 'string' && d[k]) cfg[k] = d[k]; });
      if (Array.isArray(d.emotions) && d.emotions.length) cfg.emotions = d.emotions;
      if (Array.isArray(d.closingPhrases) && d.closingPhrases.length) cfg.closingPhrases = d.closingPhrases;
      if (Array.isArray(d.history)) cfg.history = d.history;
      if (typeof d.photo === 'string' && d.photo) document.querySelectorAll('img.photo').forEach(img => { img.src = d.photo; });
      const p = d.plan || {};
      LEVELS.forEach(L => { plan[L.key] = (Array.isArray(p[L.key]) ? p[L.key] : []).filter(t => t && t.title).map((t, i) => ({ id: t.id != null ? String(t.id) : L.key + '-' + i, title: t.title, tag: t.tag })); });
      planDate = d.date || null;
      const count = plan.min.length + plan.opt.length + plan.max.length;
      planStatus = (d.status === 'pending' || !count) ? 'pending' : 'ok';
    } catch (e) {
      planStatus = 'error';
    }
    const today = zoneNow().date;
    if (today !== dayKey) await switchDay(today);
    renderPlan(); renderEmotions(); renderClosed(); renderHeader();
    if (activeTab === 'history') renderHistory();
  }

  async function switchDay(key) {
    dayKey = key;
    S = await loadDay(key);
    prevMinDone = false;
    renderScales(); renderEmotions(); renderDiary(); renderClosed();
  }

  async function init() {
    dayKey = zoneNow().date;
    S = await loadDay(dayKey);
    localHist = await loadHist();
    renderHeader(); renderScales(); renderEmotions(); renderDiary(); renderClosed();
    await loadData();
    prevMinDone = counts().minDone;
    // раз в минуту: приветствие, вечерняя подсветка, смена дня в полночь
    setInterval(async () => {
      const today = zoneNow().date;
      if (today !== dayKey) { await switchDay(today); await loadData(); }
      renderHeader(); renderDock();
    }, 60000);
  }
  init();
})();
</script>
</body>
</html>
